# =============================================================================
# configDynamicRisk.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Market / data
# -----------------------------------------------------------------------------

market:
  tickers:
    JPM: JPM
    BAC: BAC
    WFC: WFC
    C: C

  years_back: 10
  # Adjusted to 10 years based on length of returns (2513 days)

  end_date: "2025-12-20"
  # ISO format; set to null to use today

  r_daily: 8.368737649040786e-05


# -----------------------------------------------------------------------------
# GARCH parameters (Heston-Nandi, one entry per asset)
# -----------------------------------------------------------------------------

garch_params:

  0:  # JPM
    asset: "JPM"
    omega: 4.2572273156824686e-08
    alpha: 1.1659031751869056e-05
    beta: 0.8668190925770273
    gamma: 87.18804196461483
    lambda: 2.45223819422026
    h_unconditional: 0.0002626516056541572

  1:  # BAC
    asset: "BAC"
    omega: 1.5791048798706638e-07
    alpha: 1.4140334837021117e-05
    beta: 0.8562905611224154
    gamma: 84.93676359777402
    lambda: 1.3468174327538218
    h_unconditional: 0.0003429043492756117

  2:  # WFC
    asset: "WFC"
    omega: 1.092503663056854e-09
    alpha: 2.852449078460218e-05
    beta: 0.85904702449402
    gamma: 47.38864941564835
    lambda: 0.6376970144572769
    h_unconditional: 0.000370963256925866

  3:  # C
    asset: "C"
    omega: 1.000498716752056e-09
    alpha: 2.0084656820756604e-05
    beta: 0.8586185118911529
    gamma: 65.86142237937909
    lambda: 0.9214280133255159
    h_unconditional: 0.00037017613304118945


# -----------------------------------------------------------------------------
# DCC-GARCH + copula
# -----------------------------------------------------------------------------

dcc:
  nu_Q: 15.924093789716803
  dcc_alpha: 0.01645035692445027
  dcc_beta: 0.9651767135956938
  Q_bar:
    - [1.0,                0.8281596457399912, 0.7167113538886037, 0.7746443100859335]
    - [0.8281596457399912, 1.0,                0.7753253589902642, 0.8226649763761024]
    - [0.7167113538886037, 0.7753253589902642, 1.0,                0.7196824164969718]
    - [0.7746443100859335, 0.8226649763761023, 0.7196824164969718, 1.0               ]


# -----------------------------------------------------------------------------
# Environment
# -----------------------------------------------------------------------------

env:
  K: 100.0
  T_days: 252
  S0: [100.0, 100.0, 100.0, 100.0]
  r: 8.368737649040786e-05
  transaction_cost: 0.001
  basket_weights: [0.0775, 0.4434, 0.2649, 0.2142] #To show numerical values of basket weights; not used in train_dynamic.py or train_static.py as it exists in the system path pkl

#-----------------------------------------------------------------------------
# Basket pricing model path
#-----------------------------------------------------------------------------

pricing:
  system_path: "src/basket_pricing/artifacts/basket_system_dcc_surrogate.pkl"


# -----------------------------------------------------------------------------
# Actor network
# -----------------------------------------------------------------------------

actor:
  hidden_dim: 256
  action_high: 2.0
  action_low: -2.0
  init_action_mean: 0.0
  fixed_std: 1.0e-3


# -----------------------------------------------------------------------------
# Critic network
# -----------------------------------------------------------------------------

critic:
  head_dim_var: 128
  head_dim_excess: 128


# -----------------------------------------------------------------------------
# Training loop
# -----------------------------------------------------------------------------

training:

  # Outer iterations (number of actor-critic alternations)
  K: 400

  # Critic inner iterations
  K_initial: 2000
  K_star: 2000
  K_target: 300
  K_final: 2000
  n_increment: 0

  # Actor inner iterations per outer loop
  K_2: 3

  # Batch sizes
  B0: 16384
  B1: 2048
  B2: 2048

  # Risk measure & loss adjustments
  alpha: 0.95
  scoring_fn: "log"
  # log | power03 | power05 | power07 | exponential | rational

  C_shift: 40.0
  b_shift: true

  critic_grad_clip: null

  n_groups: 18

  # Optimizer
  eta_theta: 2.5e-3
  min_lr_actor: 1.0e-4
  critic_reset_lr: 2.5e-3

  actor_lr_decay: 0.997
  critic_lr_decay: 0.99999

  # Logging / checkpointing
  log_interval: 10
  log_dir: "logs"

  # Checkpoint to resume from (null = train from scratch)
  resume_checkpoint: null


# -----------------------------------------------------------------------------
# Misc
# -----------------------------------------------------------------------------

seed: 42
device: "cuda"  # "cuda" or "cpu"
